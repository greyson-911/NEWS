# TrendRadar 主配置（v6.10.0 正确格式）

push_mode: daily

# 监控源：每个源用 - platform: 名称 的格式
sources:
  - platform: baidu
  - platform: zhihu
  - platform: 36kr
  - platform: bilibili
  - platform: weibo
  - platform: toutiao
  - platform: thepaper
  - platform: jiemian
  - platform: caixin

display:
  show_keywords: false
  show_platforms: true
  show_rank: true

notifications:
  telegram:
    enabled: true

ai_analysis:
  enabled: true
  mode: follow_report
  timeout: 120
