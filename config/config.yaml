# TrendRadar 主配置文件

# ---------- 推送模式 ----------
# daily: 每天汇总推送一次（推荐，配合早上9:30定时）
# current: 实时榜单（每小时）
# incremental: 仅推送新增内容
push_mode: daily

# ---------- 数据源配置（必须！否则不会抓取任何新闻）----------
sources:
  - platform: baidu
  - platform: zhihu
  - platform: 36kr
  - platform: bilibili
  - platform: weibo
  - platform: toutiao
  - platform: thepaper
  - platform: jiemian
  - platform: caixin

# ---------- 显示控制 ----------
display:
  show_keywords: false      # 不显示关键词列表
  show_platforms: true
  show_rank: true

# ---------- Telegram 通知 ----------
notifications:
  telegram:
    enabled: true

# ---------- AI 智能分析 ----------
ai_analysis:
  enabled: true
  mode: follow_report
  timeout: 120

# ---------- AI 翻译（可选）----------
ai_translation:
  enabled: false

# ---------- 关键词文件 ----------
keyword_file: "config/frequency_words.txt"

# ---------- 输出 ----------
output:
  generate_html: true
  html_filename: "index.html"
