# ============================================================
# TrendRadar 主配置文件
# ============================================================

# ---------- 推送模式 ----------
# current  : 实时榜单（每小时）
# daily    : 日报模式（每天汇总，推荐）
# incremental : 增量模式（仅新增）
push_mode: current

# ---------- 显示控制 ----------
display:
  show_keywords: false      # 不显示匹配到的关键词列表（解决太乱的问题）
  show_platforms: true      # 显示新闻来源平台
  show_rank: true           # 显示热榜排名

# ---------- AI 智能分析 ----------
ai_analysis:
  enabled: true             # 启用 AI 分析（需 API Key）
  mode: follow_report       # 跟随推送模式
  timeout: 120              # 超时秒数

# ---------- AI 翻译（可选） ----------
ai_translation:
  enabled: false
  target_language: "zh-CN"

# ---------- 数据源配置 ----------
sources:
  - platform: baidu
  - platform: zhihu
  - platform: 36kr
  # 可继续添加：bilibili, weibo, toutiao 等

# ---------- RSS 订阅源（可选） ----------
rss_sources: []
  # - url: https://example.com/feed.xml
  #   name: "示例RSS"

# ---------- 关键词文件 ----------
keyword_file: "config/frequency_words.txt"

# ---------- 输出 ----------
output:
  generate_html: true
  html_filename: "index.html"

# 在 config.yaml 末尾添加
notifications:
  telegram:
    enabled: true
    bot_token: ""   # 留空，程序会从环境变量读取
    chat_id: ""     # 留空
